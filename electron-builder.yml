appId: com.clipboard.manager
productName: ClipboardManager
artifactName: ${productName}-Setup-${version}.${ext}
compression: maximum
directories:
  buildResources: resources
  output: dist
files:
  # TypeScript can leave duplicate source/declaration output beside the three
  # electron-vite runtime bundles. Package only those runtime directories.
  - out/main
  - out/preload
  - out/renderer
  - resources/tray-icon.png
  # The main process only loads sql.js' Node entry point. Keep that entry and
  # omit the package's unused debug/browser builds and all other dependencies.
  - "!node_modules/**"
  - node_modules/sql.js/package.json
  - node_modules/sql.js/dist/sql-wasm.js
electronLanguages:
  - en-US
  - zh-CN
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
extraResources:
  - from: native/bin/ClipboardBridge.exe
    to: native/ClipboardBridge.exe
  - from: native/ocr.ps1
    to: native/ocr.ps1
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
